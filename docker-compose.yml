name: ilp

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilp_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilp-network

  redis:
    image: redis:7-alpine
    container_name: ilp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ilp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilp_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_LIBRARY_ID: ${BUNNY_LIBRARY_ID:-}
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ilp-network

  frontend:
    build:
      context: ../ilp-frontend
      dockerfile: Dockerfile
    container_name: ilp_frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://app:80
    ports:
      - "5173:5173"
    volumes:
      - ../ilp-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
    networks:
      - ilp-network

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  ilp-network:
    driver: bridge
